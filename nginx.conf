user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning for Large Token Payload Streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Define Upsream vLLM / vSR Node Targets matching GPU allocations
    upstream vllm_backend_pool {
        # Consistent Hashing based on custom Authorization header or API tokens 
        # to ensure stateful affinity for KV-Cache stickiness
        hash $http_x_session_id consistent;

        server 127.0.0.1:8001 max_fails=2 fail_timeout=10s; # MI300X Node Cluster 1 (GPUs 0,1)
        server 127.0.0.1:8002 max_fails=2 fail_timeout=10s; # MI300X Node Cluster 2 (GPUs 2,3)
        
        keepalive 32; # Keep warm connections alive to minimize handshake latencies
    }

    server {
        listen 80;
        server_name localhost;

        # Main Entry API Endpoint for router_agent.js
        location /api/route-intent {
            proxy_pass http://vllm_backend_pool/v1/chat/completions;
            
            # Standard HTTP Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Disable buffering for real-time Server-Sent Events (SSE) token streaming
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            
            # Security Hardening for Enterprise Interfaces
            client_max_body_size 10M;
        }

        # Status Endpoint to check cluster health
        location /health {
            access_log off;
            return 200 '{"status":"healthy","engine":"AMD-ROCm-Cluster"}';
            add_header Content-Type application/json;
        }
    }
}
