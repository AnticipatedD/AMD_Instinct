name: Test Suite & Code Quality Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code targets
      uses: actions/checkout@v4

    - name: Set up Python Runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install pinned project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute code cleanliness validations (Linter checks)
      run: ruff check .

    - name: Verify architectural syntax patterns (Formatter checks)
      run: ruff format --check .

    - name: Run test suite metrics
      run: pytest -v tests/
